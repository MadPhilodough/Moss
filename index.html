<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Moss</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#12121c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f6f0" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moss" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Moss – dark: soft twilight (purples & blues, easy on the eyes) */
      --bg: #12121c;
      --surface: #1a1a28;
      --surface-hover: #24243a;
      --border: #2e2e44;
      --text: #e8e6f0;
      --text-muted: #9a96b0;
      --primary: #8b7ec8;
      --primary-hover: #7a6db8;
      --daily: #7eb8c8;
      --weekly: #8b7ec8;
      --monthly: #b89ad4;
      --yearly: #c9a0d4;
      --oneoff: #9a96b0;
      --danger: #d08090;
      --success: #7eb8a8;
      --radius: 12px;
      --shadow: 0 4px 28px rgba(0, 0, 0, 0.4);
      --header-gradient: linear-gradient(135deg, #7eb8c8 0%, #8b7ec8 50%, #b89ad4 100%);
    }

    [data-theme="light"] {
      /* Moss – light: soft lichen, cream earth, sunlit green */
      --bg: #f2f6f0;
      --surface: #ffffff;
      --surface-hover: #e8f0e4;
      --border: #d0ddd0;
      --text: #1a261e;
      --text-muted: #5c7264;
      --primary: #3d8f68;
      --primary-hover: #327a58;
      --daily: #3d8f68;
      --weekly: #5a8f48;
      --monthly: #b8943c;
      --yearly: #a66e3a;
      --oneoff: #6a7d70;
      --danger: #c45c4c;
      --success: #3d8f68;
      --shadow: 0 4px 22px rgba(25, 45, 35, 0.08);
      --header-gradient: linear-gradient(135deg, #3d8f68 0%, #b8943c 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.55;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 16px calc(80px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    header {
      text-align: center;
      margin-bottom: 36px;
      position: relative;
    }

    header h1 {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-size: 2.35rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: var(--header-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* Momentum animation – Sisyphus: moss stone rolling uphill */
    .momentum {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 80px;
      margin: 18px auto 4px;
      overflow: hidden;
    }

    .momentum-hill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background: linear-gradient(
        168deg,
        transparent 0%,
        transparent 38%,
        color-mix(in srgb, var(--primary) 14%, transparent) 48%,
        color-mix(in srgb, var(--primary) 28%, transparent) 100%
      );
      clip-path: polygon(0% 100%, 0% 78%, 100% 22%, 100% 100%);
      opacity: 0.85;
    }

    .momentum-hill::after {
      /* soft ridge line */
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background: linear-gradient(
        168deg,
        transparent 0%,
        transparent 46%,
        color-mix(in srgb, var(--primary) 45%, transparent) 47%,
        transparent 52%
      );
      clip-path: polygon(0% 100%, 0% 78%, 100% 22%, 100% 100%);
    }

    .momentum-stone {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 48% 52% 50% 50%;
      background: radial-gradient(circle at 32% 30%,
        color-mix(in srgb, var(--primary) 90%, #fff) 0%,
        var(--primary) 42%,
        color-mix(in srgb, var(--primary) 65%, #1a1a1a) 100%);
      box-shadow:
        inset -2px -3px 5px rgba(0,0,0,0.3),
        inset 1px 1px 2px rgba(255,255,255,0.15),
        0 3px 8px rgba(0,0,0,0.25);
      animation: sisyphus 9s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
      will-change: transform, left, bottom;
      z-index: 2;
    }

    .momentum-stone::before {
      /* moss patches */
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background:
        radial-gradient(circle at 28% 38%, color-mix(in srgb, var(--success) 85%, transparent) 0 2.2px, transparent 2.8px),
        radial-gradient(circle at 68% 52%, color-mix(in srgb, var(--success) 75%, transparent) 0 1.8px, transparent 2.3px),
        radial-gradient(circle at 48% 72%, color-mix(in srgb, var(--success) 70%, transparent) 0 1.5px, transparent 2px);
      opacity: 0.95;
    }

    .momentum-stone::after {
      /* subtle highlight */
      content: "";
      position: absolute;
      top: 3px;
      left: 4px;
      width: 6px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      filter: blur(0.5px);
    }

    @keyframes sisyphus {
      0% {
        left: 6%;
        bottom: 6px;
        transform: rotate(0deg) scale(1);
        opacity: 0;
      }
      5% {
        opacity: 1;
      }
      12% {
        left: 14%;
        bottom: 11px;
        transform: rotate(55deg) scale(1.02);
      }
      28% {
        left: 32%;
        bottom: 22px;
        transform: rotate(160deg) scale(1);
      }
      45% {
        left: 52%;
        bottom: 34px;
        transform: rotate(290deg) scale(1.03);
      }
      62% {
        left: 70%;
        bottom: 44px;
        transform: rotate(410deg) scale(1);
      }
      78% {
        left: 84%;
        bottom: 52px;
        transform: rotate(520deg) scale(1.02);
      }
      88% {
        left: 90%;
        bottom: 56px;
        transform: rotate(580deg) scale(1);
        opacity: 1;
      }
      94% {
        left: 92%;
        bottom: 58px;
        transform: rotate(600deg) scale(0.98);
        opacity: 0.7;
      }
      100% {
        left: 94%;
        bottom: 60px;
        transform: rotate(620deg) scale(0.9);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .momentum-stone {
        animation: none;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        opacity: 1;
      }
    }

    header p {
      font-family: "Source Sans 3", sans-serif;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
      margin-top: 8px;
      letter-spacing: 0.02em;
    }

    /* ── Add form ─────────────────────────────── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
    }

    .add-form label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 7px;
    }

    .add-form input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input[type="text"]:focus {
      border-color: var(--primary);
    }

    .add-form input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    /* Hybrid type selector: vertical icon + label rows */
    .type-selector {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 16px 0;
    }

    .type-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      width: 100%;
    }

    .type-option:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .type-option.active {
      border-color: transparent;
      color: var(--text);
    }

    .type-option.active[data-type="daily"] {
      background: color-mix(in srgb, var(--daily) 16%, transparent);
      border-color: color-mix(in srgb, var(--daily) 40%, transparent);
      color: var(--daily);
    }
    .type-option.active[data-type="weekly"] {
      background: color-mix(in srgb, var(--weekly) 16%, transparent);
      border-color: color-mix(in srgb, var(--weekly) 40%, transparent);
      color: var(--weekly);
    }
    .type-option.active[data-type="monthly"] {
      background: color-mix(in srgb, var(--monthly) 16%, transparent);
      border-color: color-mix(in srgb, var(--monthly) 40%, transparent);
      color: var(--monthly);
    }
    .type-option.active[data-type="yearly"] {
      background: color-mix(in srgb, var(--yearly) 16%, transparent);
      border-color: color-mix(in srgb, var(--yearly) 40%, transparent);
      color: var(--yearly);
    }
    .type-option.active[data-type="oneoff"] {
      background: color-mix(in srgb, var(--oneoff) 16%, transparent);
      border-color: color-mix(in srgb, var(--oneoff) 40%, transparent);
      color: var(--oneoff);
    }

    .type-icon {
      font-size: 1.15rem;
      width: 1.4rem;
      text-align: center;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .type-label {
      flex: 1;
    }

    .type-check {
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .type-option.active .type-check {
      opacity: 1;
    }

    .add-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #0e1018;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.01em;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-btn:hover {
      background: var(--primary-hover);
    }

    .add-btn.is-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Stats ────────────────────────────────── */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .stat strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Category sections ────────────────────── */
    .category-section {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .category-section.drag-over-section {
      box-shadow: 0 0 0 2px var(--primary);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .category-header:hover {
      background: var(--surface-hover);
    }

    .category-icon {
      font-size: 1.1rem;
      width: 1.4rem;
      text-align: center;
      flex-shrink: 0;
    }

    .category-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      flex: 1;
    }

    .category-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 500;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 0.85rem;
      transition: transform 0.2s ease;
    }

    .category-section.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .category-body {
      border-top: 1px solid var(--border);
      padding: 10px;
      min-height: 8px;
    }

    .category-section.collapsed .category-body {
      display: none;
    }

    /* Color accents per category */
    .category-section[data-type="daily"] .category-icon,
    .category-section[data-type="daily"] .category-title { color: var(--daily); }
    .category-section[data-type="weekly"] .category-icon,
    .category-section[data-type="weekly"] .category-title { color: var(--weekly); }
    .category-section[data-type="monthly"] .category-icon,
    .category-section[data-type="monthly"] .category-title { color: var(--monthly); }
    .category-section[data-type="yearly"] .category-icon,
    .category-section[data-type="yearly"] .category-title { color: var(--yearly); }
    .category-section[data-type="oneoff"] .category-icon,
    .category-section[data-type="oneoff"] .category-title { color: var(--oneoff); }

    /* ── Task items ───────────────────────────── */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 12px;
    }

    .task {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: grab;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      user-select: none;
      touch-action: pan-y; /* allow vertical scroll on mobile; lock only while dragging */
    }

    .task:hover {
      background: var(--surface-hover);
    }

    .task.dragging {
      opacity: 0.5;
      transform: scale(1.02);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      cursor: grabbing;
      touch-action: none; /* prevent scroll only during active drag */
    }

    .task.drag-over {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 12%, transparent);
    }

    .task.completed {
      opacity: 0.7;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-status {
      font-size: 0.78rem;
      color: var(--primary);
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: 0.01em;
      opacity: 0.9;
    }

    .task.completed .task-status {
      text-decoration: none;
    }

    .drag-handle {
      color: var(--text-muted);
      font-size: 1.05rem;
      cursor: grab;
      flex-shrink: 0;
      line-height: 1;
      padding: 2px 4px;
      opacity: 0.7;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 0.98rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .icon-btn.complete:hover { color: var(--success); }
    .icon-btn.delete:hover { color: var(--danger); }

    /* Empty state inside a category */
    .empty-category {
      text-align: center;
      padding: 18px 12px;
      color: var(--text-muted);
      font-size: 0.88rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    /* ── Streak ───────────────────────────────── */
    .streak-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 6px 0 4px;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .streak-bar strong {
      color: var(--primary);
      font-weight: 600;
    }
    .streak-bar .streak-flame {
      font-size: 1rem;
    }

    /* ── Undo toast ───────────────────────────── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(120%);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      z-index: 1000;
      font-size: 0.92rem;
      transition: transform 0.25s ease;
      max-width: calc(100vw - 32px);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
    .toast button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
      padding: 4px 6px;
    }
    .toast button:hover {
      color: var(--primary-hover);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .app {
        padding: 16px 12px calc(72px + env(safe-area-inset-bottom, 0px));
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }
      header h1 { font-size: 1.9rem; }
      .task { padding: 11px 12px; }
      .icon-btn { width: 36px; height: 36px; } /* larger tap targets */
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark mode" aria-label="Toggle theme">☾</button>
      <h1>Moss</h1>
      <p>Steady climb · Momentum builds</p>
      <div class="streak-bar" id="streak-bar" aria-live="polite"></div>
      <div class="momentum" aria-hidden="true" title="Keep rolling — momentum builds">
        <div class="momentum-hill"></div>
        <div class="momentum-stone"></div>
      </div>
    </header>

    <form class="add-form" id="add-form">
      <label for="task-input">New task</label>
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
      />

      <div class="type-selector" id="type-selector" role="radiogroup" aria-label="Task category">
        <button type="button" class="type-option active" data-type="daily">
          <span class="type-icon">↻</span>
          <span class="type-label">Daily</span>
          <span class="type-check">✓</span>
        </button>
        <button type="button" class="type-option" data-type="weekly">
          <span class="type-icon">▦</span>
          <span class="type-label">Weekly</span>
          <span class="type-check">✓</span>
        </button>
        <button type="button" class="type-option" data-type="monthly">
          <span class="type-icon">📅</span>
          <span class="type-label">Monthly</span>
          <span class="type-check">✓</span>
        </button>
        <button type="button" class="type-option" data-type="yearly">
          <span class="type-icon">🗓️</span>
          <span class="type-label">Yearly</span>
          <span class="type-check">✓</span>
        </button>
        <button type="button" class="type-option" data-type="oneoff">
          <span class="type-icon">✦</span>
          <span class="type-label">One-off</span>
          <span class="type-check">✓</span>
        </button>
      </div>

      <button type="submit" class="add-btn" id="add-btn">Add Task</button>
    </form>

    <div class="stats" id="stats"></div>

    <div id="categories"></div>

    <footer>
      Moss saves everything automatically in this browser.<br>
      Drag any task into another category to change its type.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-msg">Task deleted</span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <script>
    // ── Config ─────────────────────────────────────────────
    const CATEGORIES = [
      { id: "daily",   label: "Daily",   icon: "↻" },
      { id: "weekly",  label: "Weekly",  icon: "▦" },
      { id: "monthly", label: "Monthly", icon: "📅" },
      { id: "yearly",  label: "Yearly",  icon: "🗓️" },
      { id: "oneoff",  label: "One-off", icon: "✦" }
    ];

    const STORAGE_KEY = "task-manager-v3";
    const THEME_KEY = "task-manager-theme";
    const STREAK_KEY = "task-manager-streak";

    // ── State ──────────────────────────────────────────────
    let tasks = [];
    let selectedType = "daily";
    let collapsed = {}; // { daily: false, weekly: true, ... }
    let dragSrcId = null;
    let currentTheme = "dark"; // "dark" | "light"
    let undoBuffer = null; // { task, index, timer }
    let streak = { count: 0, lastDailyCompleteDate: null }; // YYYY-MM-DD

    // ── DOM ────────────────────────────────────────────────
    const form = document.getElementById("add-form");
    const input = document.getElementById("task-input");
    const addBtn = document.getElementById("add-btn");
    const typeSelector = document.getElementById("type-selector");
    const statsEl = document.getElementById("stats");
    const categoriesEl = document.getElementById("categories");

    // ── Persistence ────────────────────────────────────────
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          tasks = data.tasks || [];
          collapsed = data.collapsed || {};
        }
      } catch (e) {
        tasks = [];
        collapsed = {};
      }

      // Ensure every task has the fields we expect
      tasks.forEach(t => {
        if (t.completedAt === undefined) t.completedAt = t.completed ? Date.now() : null;
      });

      // Daily → reappear; completed one-offs → delete (after midnight)
      cleanupCompletedTasks();

      // Defaults: expand Daily, collapse others if never set
      CATEGORIES.forEach(c => {
        if (collapsed[c.id] === undefined) {
          collapsed[c.id] = c.id !== "daily";
        }
      });
    }

    function getStartOfToday() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    function cleanupCompletedTasks() {
      const startOfToday = getStartOfToday();
      let changed = false;

      // Daily: reset so they reappear
      tasks.forEach(t => {
        if (t.type === "daily" && t.completed && t.completedAt && t.completedAt < startOfToday) {
          t.completed = false;
          t.completedAt = null;
          changed = true;
        }
      });

      // One-off: permanently delete if completed before today
      const before = tasks.length;
      tasks = tasks.filter(t => {
        if (t.type === "oneoff" && t.completed && t.completedAt && t.completedAt < startOfToday) {
          return false; // delete
        }
        return true;
      });
      if (tasks.length !== before) changed = true;

      if (changed) save();
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, collapsed }));
      } catch (e) {}
    }

    // ── Helpers ────────────────────────────────────────────
    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function tasksOf(type) {
      return tasks.filter(t => t.type === type);
    }

    // ── Render ─────────────────────────────────────────────
    function getResetMessage(type) {
      switch (type) {
        case "daily":   return "Done for today · Back tomorrow";
        case "weekly":  return "Done this week · Back next week";
        case "monthly": return "Done this month · Back next month";
        case "yearly":  return "Done this year · Back next year";
        default:        return "Completed";
      }
    }

    function buildTaskHtml(t) {
      const completedClass = t.completed ? "completed" : "";
      const completeTitle = t.completed ? "Mark incomplete" : "Mark complete";
      const completeIcon = t.completed ? "↩" : "✓";

      let statusHtml = "";
      if (t.completed) {
        const msg = getResetMessage(t.type);
        statusHtml = '<div class="task-status">' + msg + '</div>';
      }

      return (
        '<li class="task ' + completedClass + '" draggable="true" data-id="' + t.id + '">' +
          '<span class="drag-handle" title="Drag to reorder or move">⋮⋮</span>' +
          '<div class="task-content">' +
            '<div class="task-text">' + escapeHtml(t.text) + '</div>' +
            statusHtml +
          '</div>' +
          '<div class="task-actions">' +
            '<button class="icon-btn complete" title="' + completeTitle + '" data-action="complete" data-id="' + t.id + '">' + completeIcon + '</button>' +
            '<button class="icon-btn delete" title="Delete" data-action="delete" data-id="' + t.id + '">✕</button>' +
          '</div>' +
        '</li>'
      );
    }

    function render() {
      // Stats
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      let statsHtml = '<div class="stat"><strong>' + total + '</strong> total</div>' +
                      '<div class="stat"><strong>' + done + '</strong> done</div>';
      CATEGORIES.forEach(c => {
        const n = tasksOf(c.id).length;
        if (n) statsHtml += '<div class="stat"><strong>' + n + '</strong> ' + c.label.toLowerCase() + '</div>';
      });
      statsEl.innerHTML = statsHtml;

      // Categories
      let html = "";
      CATEGORIES.forEach(cat => {
        const list = tasksOf(cat.id);
        const isCollapsed = collapsed[cat.id];
        const count = list.length;
        const collapsedClass = isCollapsed ? "collapsed" : "";

        let bodyContent;
        if (list.length === 0) {
          bodyContent = '<div class="empty-category">No ' + cat.label.toLowerCase() + ' tasks</div>';
        } else {
          bodyContent = '<ul class="task-list" data-type="' + cat.id + '">' +
                        list.map(buildTaskHtml).join("") +
                        '</ul>';
        }

        html += '<section class="category-section ' + collapsedClass + '" data-type="' + cat.id + '">' +
                  '<div class="category-header" data-toggle="' + cat.id + '">' +
                    '<span class="category-icon">' + cat.icon + '</span>' +
                    '<span class="category-title">' + cat.label + '</span>' +
                    '<span class="category-count">' + count + '</span>' +
                    '<span class="chevron">▾</span>' +
                  '</div>' +
                  '<div class="category-body">' + bodyContent + '</div>' +
                '</section>';
      });
      categoriesEl.innerHTML = html;

      attachDragListeners();
      renderStreak();
    }

    // ── Drag & Drop ────────────────────────────────────────
    function attachDragListeners() {
      document.querySelectorAll(".task").forEach(el => {
        el.addEventListener("dragstart", onDragStart);
        el.addEventListener("dragover", onDragOver);
        el.addEventListener("dragenter", onDragEnter);
        el.addEventListener("dragleave", onDragLeave);
        el.addEventListener("drop", onDrop);
        el.addEventListener("dragend", onDragEnd);
      });

      // Allow dropping onto empty category bodies / sections
      document.querySelectorAll(".category-section").forEach(sec => {
        sec.addEventListener("dragover", e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          sec.classList.add("drag-over-section");
        });
        sec.addEventListener("dragleave", e => {
          if (!sec.contains(e.relatedTarget)) {
            sec.classList.remove("drag-over-section");
          }
        });
        sec.addEventListener("drop", e => {
          e.preventDefault();
          sec.classList.remove("drag-over-section");
          const targetType = sec.dataset.type;
          if (dragSrcId && targetType) {
            moveTaskToType(dragSrcId, targetType);
          }
        });
      });
    }

    function onDragStart(e) {
      dragSrcId = this.dataset.id;
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragSrcId);
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    }

    function onDragEnter(e) {
      if (this.dataset.id !== dragSrcId) {
        this.classList.add("drag-over");
      }
    }

    function onDragLeave() {
      this.classList.remove("drag-over");
    }

    function onDrop(e) {
      e.stopPropagation();
      e.preventDefault();
      this.classList.remove("drag-over");

      const targetId = this.dataset.id;
      if (!dragSrcId || dragSrcId === targetId) return;

      const fromIdx = tasks.findIndex(t => t.id === dragSrcId);
      const toIdx = tasks.findIndex(t => t.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return;

      const targetType = tasks[toIdx].type;
      const [moved] = tasks.splice(fromIdx, 1);
      moved.type = targetType; // change category if different

      // Find new index after possible type change
      const newToIdx = tasks.findIndex(t => t.id === targetId);
      tasks.splice(newToIdx, 0, moved);

      save();
      render();
    }

    function onDragEnd() {
      this.classList.remove("dragging");
      document.querySelectorAll(".task").forEach(el => el.classList.remove("drag-over"));
      document.querySelectorAll(".category-section").forEach(el => el.classList.remove("drag-over-section"));
      dragSrcId = null;
    }

    function moveTaskToType(id, newType) {
      const t = tasks.find(t => t.id === id);
      if (!t || t.type === newType) return;
      t.type = newType;
      // Move to end of the new category group (simple approach)
      tasks = tasks.filter(x => x.id !== id);
      // Insert after the last task of that type, or at end
      let insertAt = tasks.length;
      for (let i = tasks.length - 1; i >= 0; i--) {
        if (tasks[i].type === newType) {
          insertAt = i + 1;
          break;
        }
      }
      tasks.splice(insertAt, 0, t);
      save();
      render();
    }

    // ── Actions ────────────────────────────────────────────
    function addTask(text) {
      const task = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        text: text.trim(),
        type: selectedType,
        completed: false,
        completedAt: null
      };
      // Add at the beginning of its category
      const firstOfType = tasks.findIndex(t => t.type === selectedType);
      if (firstOfType === -1) {
        tasks.push(task);
      } else {
        tasks.splice(firstOfType, 0, task);
      }
      // Ensure the category is expanded so the user sees it
      collapsed[selectedType] = false;
      save();
      render();
    }

    function deleteTask(id) {
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const [removed] = tasks.splice(idx, 1);
      save();
      render();
      showUndo(removed, idx);
    }

    function showUndo(task, index) {
      if (undoBuffer && undoBuffer.timer) clearTimeout(undoBuffer.timer);
      undoBuffer = { task, index };
      const toast = document.getElementById("toast");
      const msg = document.getElementById("toast-msg");
      if (msg) msg.textContent = "Task deleted";
      if (toast) toast.classList.add("show");
      undoBuffer.timer = setTimeout(() => {
        hideUndo(false);
      }, 5000);
    }

    function hideUndo(restored) {
      const toast = document.getElementById("toast");
      if (toast) toast.classList.remove("show");
      if (undoBuffer && undoBuffer.timer) clearTimeout(undoBuffer.timer);
      undoBuffer = null;
    }

    function undoDelete() {
      if (!undoBuffer) return;
      const { task, index } = undoBuffer;
      const insertAt = Math.min(index, tasks.length);
      tasks.splice(insertAt, 0, task);
      save();
      render();
      hideUndo(true);
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }

    function loadStreak() {
      try {
        const raw = localStorage.getItem(STREAK_KEY);
        if (raw) streak = JSON.parse(raw);
      } catch (e) {
        streak = { count: 0, lastDailyCompleteDate: null };
      }
    }

    function saveStreak() {
      try {
        localStorage.setItem(STREAK_KEY, JSON.stringify(streak));
      } catch (e) {}
    }

    function yesterdayStr() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }

    /** Call when user completes a daily task — updates streak if all dailies done today */
    function updateStreakOnDailyComplete() {
      const dailies = tasks.filter(t => t.type === "daily");
      if (!dailies.length) return;
      const allDone = dailies.every(t => t.completed);
      if (!allDone) return;

      const today = todayStr();
      if (streak.lastDailyCompleteDate === today) return; // already counted today

      if (streak.lastDailyCompleteDate === yesterdayStr()) {
        streak.count = (streak.count || 0) + 1;
      } else {
        streak.count = 1;
      }
      streak.lastDailyCompleteDate = today;
      saveStreak();
    }

    function renderStreak() {
      const el = document.getElementById("streak-bar");
      if (!el) return;
      // If last complete was before yesterday, streak is broken for display
      const today = todayStr();
      const yday = yesterdayStr();
      let count = streak.count || 0;
      if (streak.lastDailyCompleteDate && streak.lastDailyCompleteDate !== today && streak.lastDailyCompleteDate !== yday) {
        count = 0;
      }
      if (count > 0) {
        el.innerHTML = '<span class="streak-flame">✦</span> <strong>' + count + '</strong> day' + (count === 1 ? "" : "s") + " momentum";
      } else {
        el.innerHTML = '<span class="streak-flame">✧</span> Complete all dailies to start a streak';
      }
    }

    function toggleComplete(id) {
      const t = tasks.find(t => t.id === id);
      if (t) {
        t.completed = !t.completed;
        t.completedAt = t.completed ? Date.now() : null;
        if (t.completed && t.type === "daily") updateStreakOnDailyComplete();
        save();
        render();
      }
    }

    // ── Events ─────────────────────────────────────────────
    function updateAddButton() {
      const empty = input.value.trim().length === 0;
      addBtn.classList.toggle("is-disabled", empty);
    }

    function doAddTask() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      addTask(text);
      input.value = "";
      updateAddButton();
      input.focus();
    }

    input.addEventListener("input", updateAddButton);
    input.addEventListener("keyup", updateAddButton);
    input.addEventListener("change", updateAddButton);

    form.addEventListener("submit", e => {
      e.preventDefault();
      doAddTask();
    });

    // Direct click handler as a safety net (in case form submit is blocked for any reason)
    addBtn.addEventListener("click", e => {
      e.preventDefault();
      doAddTask();
    });

    typeSelector.addEventListener("click", e => {
      const btn = e.target.closest(".type-option");
      if (!btn) return;
      e.preventDefault();
      selectedType = btn.dataset.type;
      typeSelector.querySelectorAll(".type-option").forEach(b => {
        b.classList.toggle("active", b.dataset.type === selectedType);
      });
    });

    categoriesEl.addEventListener("click", e => {
      // Toggle collapse
      const header = e.target.closest("[data-toggle]");
      if (header) {
        const type = header.dataset.toggle;
        collapsed[type] = !collapsed[type];
        save();
        render();
        return;
      }

      // Task actions
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (action === "delete") deleteTask(id);
      else if (action === "complete") toggleComplete(id);
    });

    // ── Theme ──────────────────────────────────────────────
    const themeToggleBtn = document.getElementById("theme-toggle");

    function applyTheme(theme) {
      currentTheme = theme;
      try {
        document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "");
      } catch (e) {}

      if (themeToggleBtn) {
        themeToggleBtn.textContent = theme === "light" ? "☀" : "☾";
        themeToggleBtn.title = theme === "light" ? "Switch to dark mode" : "Switch to light mode";
      }

      try {
        document.querySelectorAll('meta[name="theme-color"]').forEach(function(m) {
          m.setAttribute("content", theme === "light" ? "#f2f6f0" : "#12121c");
        });
      } catch (e) {}

      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {}
    }

    function loadTheme() {
      let saved = "dark";
      try {
        saved = localStorage.getItem(THEME_KEY) || "dark";
      } catch (e) {}
      applyTheme(saved === "light" ? "light" : "dark");
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", function() {
        applyTheme(currentTheme === "dark" ? "light" : "dark");
      });
    }

    // ── Service Worker (PWA offline support) ───────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }

    // ── Init ───────────────────────────────────────────────
    // Undo button
    const toastUndoBtn = document.getElementById("toast-undo");
    if (toastUndoBtn) {
      toastUndoBtn.addEventListener("click", function(e) {
        e.preventDefault();
        undoDelete();
      });
    }

    try {
      loadTheme();
      loadStreak();
      load();
      render();
      updateAddButton();
      input.focus();
    } catch (err) {
      console.error("Moss init error:", err);
      // Fallback so the page is still usable
      categoriesEl.innerHTML = "<p style='color:#d48484;padding:20px'>Something went wrong loading tasks. Try refreshing or clearing site data for this page.</p>";
    }
  </script>
</body>
</html>
